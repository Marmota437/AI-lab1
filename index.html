<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Map puzzle</title>
    <link rel="stylesheet" href="style.css" />
    <script src="skrypt.js" defer></script>

</head>
<body>
    <div class="top-row">
    <div id="map"></div>

    <canvas id="rasterMap"></canvas>
    </div>

    <button id="getLocation">Get Current Location</button>
    <button id="saveButton">Save Raster Map</button>
    <br>

    <div class="drag-target" id="drag-target-15"></div>

    <div class="drag-target" id="drag-target-16"></div>
</div>

    <div id="pieces-grid">

    <div id="draggable-item-2" class="item draggable" draggable="true"></div>
    <div id="draggable-item-3" class="item draggable" draggable="true"></div>
